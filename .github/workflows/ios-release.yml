name: iOS Release Upload

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload build to TestFlight"
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      upload_to_testflight:
        required: false
        default: true
        type: boolean
    secrets:
      APPSTORE_KEY_ID:
        required: true
      APPSTORE_ISSUER_ID:
        required: true
      APPSTORE_PRIVATE_KEY:
        required: true
      BUILD_CERTIFICATE_BASE64:
        required: true
      P12_PASSWORD:
        required: true
      KEYCHAIN_PASSWORD:
        required: true

jobs:
  build-and-upload:
    runs-on: macos-15
    env:
      APP_BUNDLE_IDENTIFIER: com.praveenmurugesan.Shift
      APP_NAME: Shift
      MARKETING_VERSION_PREFIX: "1.0"
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: lefthandmagic/shift
          ref: ${{ github.repository == 'lefthandmagic/shift' && github.ref || 'refs/heads/main' }}

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode
        run: xcodebuild -version && xcodebuild -showsdks

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install fastlane
        run: sudo gem install fastlane -NV

      - name: Create App Store Connect API key JSON
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          output_path = Path(os.environ["RUNNER_TEMP"]) / "api_key.json"
          payload = {
              "key_id": os.environ["APPSTORE_KEY_ID"],
              "issuer_id": os.environ["APPSTORE_ISSUER_ID"],
              "key": os.environ["APPSTORE_PRIVATE_KEY"],
          }
          output_path.write_text(json.dumps(payload), encoding="utf-8")
          PY
          echo "API_KEY_PATH=$RUNNER_TEMP/api_key.json" >> "$GITHUB_ENV"

      - name: Ensure App Store Connect app + bundle ID
        run: |
          set +e
          PRODUCE_OUT=$(fastlane ensure_app 2>&1)
          PRODUCE_STATUS=$?
          set -e
          echo "$PRODUCE_OUT"
          if [ "$PRODUCE_STATUS" -ne 0 ]; then
            if echo "$PRODUCE_OUT" | grep -qiE 'already exists|taken|already been created'; then
              echo "App or bundle ID already exists; continuing."
            else
              exit "$PRODUCE_STATUS"
            fi
          fi

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Fetch or create App Store profile
        run: |
          fastlane fetch_profile
          PP_PATH=$(ls "$RUNNER_TEMP"/*.mobileprovision | head -1)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PLIST="$(security cms -D -i "$PP_PATH")"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$PROFILE_PLIST")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Compute version numbers
        run: |
          MARKETING_VERSION="${MARKETING_VERSION_PREFIX}.${{ github.run_number }}"
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "CURRENT_PROJECT_VERSION=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Run tests
        continue-on-error: true
        run: |
          DESTINATIONS=$(xcodebuild -project "Shift.xcodeproj" -scheme "Shift" -showdestinations)
          TEST_DESTINATION_ID=$(printf "%s\n" "$DESTINATIONS" \
            | awk '/platform:iOS Simulator/ && /id:/ {
                id=$0
                sub(/^.*id:/, "", id)
                sub(/,.*$/, "", id)
                if (id !~ /^dvtdevice-/ && length(id) == 36) {
                  print id
                  exit
                }
              }')
          if [ -n "$TEST_DESTINATION_ID" ]; then
            xcodebuild \
              -project "Shift.xcodeproj" \
              -scheme "Shift" \
              -configuration Debug \
              -destination "id=$TEST_DESTINATION_ID" \
              CODE_SIGNING_ALLOWED=NO \
              test
          else
            xcodebuild \
              -project "Shift.xcodeproj" \
              -scheme "Shift" \
              -configuration Debug \
              -destination "generic/platform=iOS Simulator" \
              CODE_SIGNING_ALLOWED=NO \
              build-for-testing
          fi

      - name: Archive
        run: |
          xcodebuild \
            -project "Shift.xcodeproj" \
            -scheme "Shift" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Shift.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=DNQVHANQBU \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PRODUCT_BUNDLE_IDENTIFIER="com.praveenmurugesan.Shift" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            archive

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>DNQVHANQBU</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.praveenmurugesan.Shift</key>
                  <string>$PROFILE_NAME</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Shift.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        run: |
          fastlane pilot upload \
            --ipa "$RUNNER_TEMP/export/Shift.ipa" \
            --api_key_path "$API_KEY_PATH" \
            --skip_waiting_for_build_processing true \
            --distribute_external false

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shift-ipa
          path: ${{ runner.temp }}/export/*.ipa
